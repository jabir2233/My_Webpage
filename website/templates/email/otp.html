<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Jabir2233 OTP</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .email-container {
      max-width: 300px;
      margin: 30px auto;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 20px;
      border: 1px solid #ddd;
    }
    .header {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #312da8;
      margin-bottom: 20px;
    }
    .content {
      font-size: 16px;
      color: black;
      line-height: 1.5;
    }
    .content strong{
      color: #312da8;
      font-size: 19px;
    }
    .otp-box {
      margin: 20px 0;
      text-align: center;
    }
    .otp-code {
      display: inline-block;
      font-size: 32px;
      font-weight: bold;
      padding: 15px 30px;
      border: 2px dashed #f5f5f5;
      border-radius: 6px;
      background-color: #312da8;
      letter-spacing: 4px;
      color: white;
    }
    .footer {
      font-size: 12px;
      color: #999999;
      margin-top: 30px;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="email-container">
    <div class="header">Jabir2233</div>
    <div class="content">
      Ahoy! <strong>{{ username }}</strong>,<br><br>
      Thanks for using <strong>Jabir2233</strong>.<br>
      Here is the OTP code for verifying your email:
    </div>
    <div class="otp-box">
      <div class="otp-code">{{ otp_code }}</div>
    </div>
    <div class="content">
      If you didn’t request this email, just ignore it.<br><br>
      Regards,<br>
      <strong>Jabir</strong>
    </div>
    <div class="footer">
      Please don’t reply to this email.<br>
      © All rights reserved
    </div>
  </div>
</body>
</html>
