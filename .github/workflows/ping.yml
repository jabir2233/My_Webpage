name: Keep Render Site Awake

on:
  schedule:
    # Every 15 minutes
    - cron: '*/14 * * * *'
  workflow_dispatch: # allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Jabir2233
        run: |
          echo "Pinging site..."
          curl -s https://jabir2233.onrender.com || echo "Ping failed"
